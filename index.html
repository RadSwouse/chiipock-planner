<meta name="mobile-web-app-capable" content="yes">

<body>
<title>Chiikawa Pocket Upgrade Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a pocket notebook — one column, three tabs, ranked "receipts" of upgrades with a gain bar. */
:root {
  --paper: #F6F7FB; --card: #FFFFFF; --ink: #23263A; --muted: #666B85; --line: #E2E4EE; --chip: #ECEEF6;
  --pink: #D9577B; --pink-soft: #FBE4EB; --mint: #23966F; --mint-soft: #DDF3EA; --sun: #C98A0F; --sun-soft: #FCF0D4;
  --shadow: 0 1px 2px rgba(35, 38, 58, .06), 0 4px 14px rgba(35, 38, 58, .05);
  --tile: #FFF8EC; --tile-line: #CDB9A4; --tile-ink: #6B4F3F; --board: #FBF4E8; --board-line: #E8D9C6; --tape: rgba(222, 205, 180, .75); --max: #F07F98; --max-ink: #FFFFFF; --tag: #F49A2C; --path: #B9A08A;
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14162A; --card: #1C1F35; --ink: #ECEDF6; --muted: #9EA2BC; --line: #2B2F4A; --chip: #252943;
  --pink: #F28AA7; --pink-soft: #3A2234; --mint: #4FCB9F; --mint-soft: #173A31; --sun: #F2C25C; --sun-soft: #3A3120;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  --tile: #2A2534; --tile-line: #5B4E5E; --tile-ink: #E9DCCB; --board: #1F1B29; --board-line: #3A3245; --tape: rgba(140, 120, 100, .55); --max: #C95A76; --max-ink: #FFFFFF; --tag: #E08B22; --path: #8C7A6B;
} }
:root[data-theme="dark"] {
  --paper: #14162A; --card: #1C1F35; --ink: #ECEDF6; --muted: #9EA2BC; --line: #2B2F4A; --chip: #252943;
  --pink: #F28AA7; --pink-soft: #3A2234; --mint: #4FCB9F; --mint-soft: #173A31; --sun: #F2C25C; --sun-soft: #3A3120;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  --tile: #2A2534; --tile-line: #5B4E5E; --tile-ink: #E9DCCB; --board: #1F1B29; --board-line: #3A3245; --tape: rgba(140, 120, 100, .55); --max: #C95A76; --max-ink: #FFFFFF; --tag: #E08B22; --path: #8C7A6B;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: .01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
.num, input[type=number], .gain { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

header.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); display: inline-block; transform: translateY(-2px); }
.save { font-size: .78rem; color: var(--muted); }
a { color: var(--pink); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px;
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
nav.tabs::-webkit-scrollbar { display: none; }
/* PC: with a mouse there's no swipe, so the tabs wrap onto a second line instead of hiding off the edge */
@media (min-width: 700px), (hover: hover) and (pointer: fine) {
  nav.tabs { flex-wrap: wrap; overflow-x: visible; }
}
.fatal { background: var(--pink-soft); color: var(--ink); border: 1px solid var(--pink); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: .85rem; }
.fatal code { font-family: var(--f-num); font-size: .78rem; word-break: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
nav.tabs .chip { padding: 8px 14px; font-weight: 600; border-color: var(--line); background: var(--card); }
nav.tabs .chip[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
nav.tabs .chip[data-nav=set] { margin-left: auto; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 500; }
.chip[aria-pressed=true] { background: var(--pink-soft); border-color: var(--pink); color: var(--ink); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.banner { background: var(--sun-soft); border: 1px solid var(--sun); border-radius: 12px; padding: 10px 12px; font-size: .88rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner button { margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .88rem; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn.ghost { background: transparent; }

/* damage mix */
.mix { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--chip); }
.mix span { display: block; height: 100%; }
.mix .n { background: var(--ink); opacity: .75; } .mix .s { background: var(--pink); } .mix .a { background: var(--sun); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; transform: translateY(1px); }

/* ranked upgrade receipts */
.group-h { display: flex; align-items: baseline; gap: 8px; margin: 4px 2px 2px; }
.group-h .muted { font-size: .8rem; }
ol.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.up { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 12px; background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; }
.up.top { border-color: var(--mint); box-shadow: 0 0 0 1px var(--mint) inset; }
.up .pos { grid-row: span 2; font-family: var(--f-display); font-weight: 900; color: var(--muted); font-size: 1rem; text-align: center; }
.up.top .pos { color: var(--mint); }
.up .what { min-width: 0; }
.up .name { font-weight: 600; }
.up .act { font-size: .85rem; color: var(--muted); }
.up .gain { font-size: 1.05rem; font-weight: 500; color: var(--mint); text-align: right; white-space: nowrap; }
.up .gain.neg { color: var(--pink); }
.up .done { margin-left: auto; padding: 4px 10px; font-size: .8rem; border-color: var(--mint); color: var(--mint); }
.up .done:hover { background: var(--mint-soft); }
.toast-undo { margin-left: 12px; background: none; border: 0; color: var(--pink); font-weight: 700; padding: 2px 4px; text-decoration: underline; }
.up .meta { grid-column: 2 / 4; display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); align-items: center; }
.bar { grid-column: 2 / 4; height: 4px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--mint); border-radius: 999px; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--ink); letter-spacing: .02em; }
.r1 { background: var(--chip); } .r2 { background: var(--sun-soft); } .r3 { background: var(--pink-soft); }
.more { align-self: flex-start; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; font-size: .9rem; }

/* inventory editor */
details.inv { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
details.inv > summary { cursor: pointer; padding: 12px 14px; font-family: var(--f-display); font-weight: 700; list-style: none; display: flex; gap: 8px; align-items: center; }
details.inv > summary::after { content: "＋"; margin-left: auto; color: var(--muted); }
details.inv[open] > summary::after { content: "－"; }
.inv-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.items { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .nm { min-width: 0; font-size: .92rem; }
.item .nm .muted { font-size: .78rem; }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ctl label { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
input[type=number] { width: 4.6em; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); text-align: right; }
input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); width: 100%; }
select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); max-width: 100%; }
input[type=checkbox], input[type=radio] { accent-color: var(--pink); width: 18px; height: 18px; }
.sub-h { font-family: var(--f-display); font-weight: 700; font-size: .85rem; color: var(--muted); padding-top: 10px; letter-spacing: .03em; }
.item.off .nm { color: var(--muted); }

/* team */
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
.slot .i { font-family: var(--f-num); color: var(--muted); font-size: .8rem; text-align: center; }
.slot select { width: 100%; }
.slot .fires { grid-column: 2 / 4; margin-top: -4px; font-size: .75rem; color: var(--muted); }
.mv { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 30px; height: 30px; padding: 0; }
.result { background: var(--mint-soft); border-radius: 12px; padding: 10px 12px; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
.result ol { margin: 0; padding-left: 20px; }

/* settings */
.field { display: grid; grid-template-columns: 1fr 9.5em; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field input[type=text] { text-align: right; font-family: var(--f-num); }
.field .hint { font-size: .76rem; color: var(--muted); }
textarea { width: 100%; min-height: 90px; font-family: var(--f-num); font-size: .78rem; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper);
  padding: 8px 14px; border-radius: 999px; font-size: .85rem; z-index: 20; }

/* skill trees, drawn like the in-game boards: root at the bottom, taped tiles, dashed links */
.board { background: var(--board); border: 1px solid var(--board-line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.board-tabs { display: flex; gap: 6px; }
.board-tab { flex: 1; border: 1px solid var(--tile-line); background: var(--tile); color: var(--tile-ink); border-radius: 10px 10px 4px 4px; padding: 7px 8px; font-family: var(--f-display); font-weight: 700; }
.board-tab[aria-pressed=true] { background: var(--tile-ink); color: var(--tile); border-color: var(--tile-ink); }
.node-panel { background: var(--tile); border: 1.5px solid var(--tile-line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; color: var(--tile-ink); }
.node-panel .fx { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fx-line { border: 1.5px solid var(--tile-line); border-radius: 999px; padding: 3px 10px; text-align: center; font-weight: 600; font-size: .88rem; background: var(--card); color: var(--tile-ink); }
.fx-line.next { border-color: var(--tag); color: var(--tag); }
.fx-arrow { text-align: center; font-size: .7rem; line-height: 1; color: var(--tile-line); }
.node-panel .ctrl { grid-column: 1 / 3; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.node-panel .ctrl .stepbtn { width: 38px; height: 34px; border-radius: 10px; border: 1.5px solid var(--tile-line); background: var(--card); color: var(--tile-ink); font-weight: 700; font-size: 1.05rem; }
.node-panel .ctrl input { width: 5.2em; }
.node-panel .info { grid-column: 1 / 3; font-size: .82rem; color: var(--tile-ink); display: flex; flex-direction: column; gap: 2px; }
.tree-scroll { max-height: 470px; overflow-y: auto; overflow-x: hidden; border-radius: 12px; background: var(--paper); border: 1px solid var(--board-line); scroll-behavior: smooth; }
.tree { position: relative; margin: 0 auto; }
.tree > svg { position: absolute; left: 50%; top: 0; overflow: visible; pointer-events: none; }
.tree line { stroke: var(--path); stroke-width: 2.5; stroke-dasharray: 5 6; stroke-linecap: round; }
.tree line.done { stroke: var(--tile-ink); stroke-dasharray: none; stroke-width: 3.5; }
.tnode { position: absolute; width: 68px; height: 68px; border-radius: 8px; background: var(--tile); border: 2px solid var(--tile-line); color: var(--tile-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 0 4px; box-shadow: 0 2px 0 var(--tile-line); cursor: pointer; font: inherit; }
.tnode::before { content: ""; position: absolute; top: -6px; left: 50%; width: 30px; height: 11px; transform: translateX(-50%) rotate(-4deg); background: var(--tape); border-radius: 2px; }
.tnode svg { width: 26px; height: 26px; margin-bottom: auto; margin-top: 9px; }
.tnode .lbl { font-size: .6rem; line-height: 1; font-weight: 600; letter-spacing: .02em; opacity: .85; }
.tnode .lv { font-family: var(--f-display); font-weight: 900; font-size: .9rem; line-height: 1.15; }
.tnode.locked { color: var(--path); border-color: var(--board-line); box-shadow: 0 2px 0 var(--board-line); }
.tnode.locked.max { color: var(--max-ink); opacity: .7; }
.tnode.max { background: var(--max); color: var(--max-ink); border-color: var(--max); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.tnode.max::after { content: "MAX"; position: absolute; top: -9px; right: -8px; background: var(--tag); color: #fff; font-size: .58rem; font-weight: 800; padding: 1px 5px; border-radius: 4px; transform: rotate(6deg); }
.tnode.sel { outline: 3px solid var(--tag); outline-offset: 2px; }
.tnode .next { position: absolute; top: -10px; left: -10px; background: var(--mint); color: #fff; font-size: .58rem; font-weight: 800; padding: 2px 6px; border-radius: 999px; }
.tree-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }

/* handbook cards, after the in-game Handbook */
.hb-card { background: var(--tile); border: 1.5px solid var(--board-line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; color: var(--tile-ink); }
.hb-card.done { border-color: var(--max); }
.hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--board-line); padding-bottom: 4px; }
.hb-name { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }
.hb-lv { font-family: var(--f-display); font-weight: 700; white-space: nowrap; }
.hb-stat { display: flex; justify-content: space-between; gap: 8px; background: var(--board); border-radius: 999px; padding: 3px 12px; font-weight: 600; font-size: .88rem; }
.hb-next { color: var(--tag); }
.hb-need { background: var(--board); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.hb-need-h { font-size: .8rem; font-weight: 600; }
.hb-items { display: flex; flex-wrap: wrap; gap: 6px; }
.hb-item { font-size: .76rem; background: var(--card); border: 1px solid var(--board-line); border-radius: 8px; padding: 3px 7px; color: var(--ink); }
.hb-item b { font-weight: 600; color: var(--muted); }
.hb-item.ok b { color: var(--mint); }
.hb-item.missing { opacity: .6; border-style: dashed; }

/* Om Nom Fest booths */
.bslots { display: flex; flex-direction: column; gap: 6px; }
.bslot { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "role name rate" "role spec rate"; gap: 0 8px; align-items: center;
  background: var(--board); border-radius: 10px; padding: 6px 10px; }
.bslot .pill { grid-area: role; }
.bslot .bname { grid-area: name; min-width: 0; font-weight: 600; font-size: .9rem; }
.bslot .bspec { grid-area: spec; font-size: .76rem; color: var(--muted); }
.bslot .bspec.ok { color: var(--mint); font-weight: 600; }
.bslot .brate { grid-area: rate; font-size: .85rem; }
.bslot.empty { grid-template-areas: "role name rate"; }

details.mem { background: var(--card); border: 1px solid var(--board-line); border-radius: 8px; padding: 4px 8px; color: var(--ink); }
details.mem > summary { cursor: pointer; font-size: .82rem; font-weight: 600; list-style: none; }
details.mem > summary::before { content: "▸ "; color: var(--muted); }
details.mem[open] > summary::before { content: "▾ "; }
details.mem > div { padding: 4px 0 2px 14px; line-height: 1.4; }
@media (max-width: 480px) {
  .field { grid-template-columns: 1fr 7.5em; }
  .item { grid-template-columns: 1fr; }
  .ctl { justify-content: flex-start; }
}
@media (prefers-reduced-motion: no-preference) { .bar b { transition: width .25s ease; } }
</style>

<div class="wrap">
<script>
/* If anything fails to load or run (an older or stricter browser), say so on the page instead of showing a blank screen. */
(function () {
  var shown = 0;
  function show(msg) {
    if (shown++ > 2) return;
    var box = document.createElement('div'); box.className = 'fatal'; box.setAttribute('role', 'alert');
    box.innerHTML = '<b>Something went wrong in this browser.</b> Try reloading. If it keeps happening, send a screenshot of this box.<br><code></code>';
    box.querySelector('code').textContent = String(msg).slice(0, 300) + ' · ' + navigator.userAgent;
    var w = document.querySelector('.wrap'); (w || document.body).insertBefore(box, w ? w.firstChild : null);
  }
  window.addEventListener('error', function (e) { show(e.message || e.error || 'error'); });
  window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason || 'promise error'); });
  window.__showFatal = show;
})();
</script>
  <header class="top">
    <h1><span class="dot" aria-hidden="true"></span> Chiikawa Pocket Upgrade Planner</h1>
    <div class="row" style="justify-content:space-between"><span class="muted small">Ranks every upgrade by how much it raises your total damage.</span><span class="save" id="save-state">Loading…</span></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="nav" aria-label="Sections"></nav>

  <main id="view-set" class="stack" hidden></main>
</div>

/* Chiipoke upgrade planner — calculation engine.
   Pure functions over DATA2 (data2.js) and a plain `st` state object. No DOM. */
'use strict';

const D = DATA2;

/* ---------------- numbers: the game prints a=10^3, b=10^6 … ---------------- */
function tierLetters(t) {
  let s = '';
  t -= 1;
  do { s = String.fromCharCode(97 + (t % 26)) + s; t = Math.floor(t / 26) - 1; } while (t >= 0);
  return s;
}
function fmtNum(x, digits = 3) {
  if (!isFinite(x)) return '∞';
  if (x === 0) return '0';
  const neg = x < 0; x = Math.abs(x);
  if (x < 1000) {
    const s = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x >= 1 ? x.toFixed(2) : x.toPrecision(2);
    return (neg ? '-' : '') + String(+s);
  }
  let t = 0;
  while (x >= 1000) { x /= 1000; t++; }
  const s = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
  return (neg ? '-' : '') + String(+s) + tierLetters(t);
}
function parseNum(raw) {
  if (raw == null) return NaN;
  const s = String(raw).trim().replace(/[,%\s]/g, '');
  if (!s) return NaN;
  const m = s.match(/^(-?[0-9]*\.?[0-9]+(?:e[+-]?\d+)?)([a-zA-Z]{0,3})$/);
  if (!m) return NaN;
  let v = parseFloat(m[1]);
  const suf = m[2];
  if (!suf) return v;
  const kmbt = { K: 1, M: 2, B: 3, T: 4 };
  if (suf.length === 1 && kmbt[suf]) return v * Math.pow(1000, kmbt[suf]);
  const low = suf.toLowerCase();
  let t = 0;
  for (const ch of low) { if (ch < 'a' || ch > 'z') return NaN; t = t * 26 + (ch.charCodeAt(0) - 96); }
  return v * Math.pow(1000, t);
}
function fmtPct(g) {
  // a damage gain ratio (0.0123 -> "+1.23%")
  if (!isFinite(g)) return '—';
  const p = g * 100;
  if (Math.abs(p) >= 1000) return (p > 0 ? '+' : '') + fmtNum(p) + '%';
  if (Math.abs(p) >= 10) return (p > 0 ? '+' : '') + p.toFixed(1) + '%';
  if (Math.abs(p) >= 0.1) return (p > 0 ? '+' : '') + p.toFixed(2) + '%';
  if (p === 0) return '+0%';
  return (p > 0 ? '+' : '') + p.toPrecision(2) + '%';
}

// the game truncates the numbers it prints (2.0158a shows as 2.01a), so rates shown next to in-game ones do the same
function fmtTrunc(x) {
  if (!(x > 0) || !isFinite(x)) return fmtNum(x);
  const p = Math.pow(10, Math.floor(Math.log10(x)) - 2);
  return fmtNum(Math.floor(x / p + 1e-9) * p);
}
function fmtDur(min) {
  if (!isFinite(min)) return '—';
  if (min < 60) return Math.max(1, Math.round(min)) + ' min';
  if (min < 48 * 60) return (min / 60).toFixed(min < 600 ? 1 : 0) + ' h';
  return (min / 1440).toFixed(1) + ' days';
}

/* ---------------- level curves ---------------- */
function lrvRow(r, L) {
  if (!r) return 0;
  let v;
  if (r.t === 'Default') v = r.e === r.s ? r.ev : r.sv + (r.ev - r.sv) * (L - r.s) / (r.e - r.s);
  else if (r.t === 'AddConstant') v = L > 0 ? r.sv + r.ev * (L - r.s) : 0;
  else if (r.t === 'FixedLevel') v = L >= r.s ? r.sv : 0;
  else v = r.sv;
  return r.vt === 'Permil' ? v / 1000 : v;
}
function group(g, L) {
  const rows = D.lrv[g];
  if (!rows || !rows.length) return 0;
  let hit = rows.find(r => L >= r.s && L <= r.e);
  if (!hit) { const c = rows.filter(r => r.s <= L); hit = c.length ? c[c.length - 1] : rows[0]; }
  return lrvRow(hit, L);
}
function fxVal(fx, L) {
  if (!fx) return 0;
  if (fx.g) return group(fx.g, L);
  return fx.vt === 'Permil' ? fx.v / 1000 : fx.v;
}
function expCost(g, from, to) {
  const t = D.exp[g];
  if (!t || t[to] == null || t[from] == null) return null;
  return t[to] - t[from];
}

/* ---------------- indexes ---------------- */
const COSTUME = {}; for (const c of D.costumes) COSTUME[c.id] = c;
const ASSIST = {}; for (const a of D.assists) ASSIST[a.id] = a;
const ASSIST_BY_CHAR = {}; for (const a of D.assists) ASSIST_BY_CHAR[a.char] = a;
const FOOD = {}; for (const f of D.foods) FOOD[f.id] = f;
const TREASURE = {}; for (const t of D.treasures) TREASURE[t.id] = t;
const KEYCHAIN = {}; for (const k of D.keychains) KEYCHAIN[k.id] = k;
const GUIDE = {}; for (const g of D.guidebook) GUIDE[g.id] = g;
const HOME = {}; for (const h of D.homeItems) HOME[h.id] = h;
const GEAR = { weapon: {}, tool: {} }; for (const g of D.gear || []) GEAR[g.kind][g.id] = g;
const gearInv = (st, kind) => (kind === 'weapon' ? st.weapons : st.tools) || {};

const homeName = h => h.name || `No. ${h.id}`;
const STAR = { Normal: 1, NormalRare: 2, Rare: 3, SuperRare: 4, HyperRare: 5, UltraRare: 6, LegendRare: 7 };
const charName = c => D.chars[c] || ('Character ' + c);
const assistName = ch => (ASSIST_BY_CHAR[ch] ? ASSIST_BY_CHAR[ch].name : 'Assist ' + ch);
const costumeName = c => `[${D.sets[c.set] || 'Outfit'}] ${charName(c.char)}`;  // the game's own format
const assistStar = a => STAR[a.rarity] || 1;

/* stats the ranking cares about, with the status-screen label */
// labels as the Global client's status screen shows them
const STATS = {
  Attack: 'ATK', CriticalRate: 'Critical Rate', CriticalDamage: 'Critical Damage',
  NormalAttackDamageRate: 'Normal Attack Damage', UniqueSkillDamageRate: 'Special Attack Damage',
  SkillDamageRate: 'Special Attack & Assist Damage', BossDamageRate: 'VS Boss Damage', MobDamageRate: 'Damage to Non-Bosses',
  AssistSkillDamage: 'Assist damage (keychain bonuses)',
};
const SHORT = {
  Attack: 'ATK', CriticalRate: 'Critical Rate', CriticalDamage: 'Critical Damage', NormalAttackDamageRate: 'Normal Attack Damage',
  UniqueSkillDamageRate: 'Special Attack Damage', SkillDamageRate: 'Special Attack & Assist Damage', BossDamageRate: 'VS Boss Damage',
  MobDamageRate: 'Damage to Non-Bosses', AssistSkillDamage: 'Assist Damage', Health: 'HP', HealthRecover: 'Healing',
  GoldAcquire: 'Coins Earned', CostumeExperience: 'Small Candy Strength', StudySpeed: 'Study Speed',
  StudyResourceAcquire: 'Whistle Candies Earned', WeedingActionStaminaRecoverSpeed: 'Stamina Recovery Rate Boost',
  WeedingActionMaxStamina: 'Max Stamina', BattleTimeLimit: 'Battle Time Limit', UniqueSkillCoolTime: 'Reduce Special & Assist Cooldown',

// Default stacking: "+X%" bonuses multiply by (1+X) except crit stats, which add (see Settings).
// Default stacking: Attack bonuses multiply (the datamine's ×10^20+ collection multiplier proves it).
// Damage-rate stats default to adding within the stat: that is what makes "raise whatever is furthest behind"
// the winning pattern players observe. Each can be switched under Stats → How bonuses stack.
// 'mul' = the game's rule above (adds within a source type, multiplies across types); 'add' = everything adds
const DEFAULT_STACK = { CriticalDamage: 'mul', CriticalRate: 'add', NormalAttackDamageRate: 'mul',
  UniqueSkillDamageRate: 'mul', SkillDamageRate: 'mul', BossDamageRate: 'mul', MobDamageRate: 'mul', AssistSkillDamage: 'mul' };

/* ---------------- default / example state ---------------- */
function blankState() {
  return {
    v: 1, example: false,
    stats: { cr: 0.1, cd: 120, nr: 100, ur: 100, sr: 100, boss: 100, mob: 100, asd: 100, spd: 1, cdr: 0, acdr: 0 },  // a new account's Stats window
    mode: 'boss', aoe: 3, stack: {},  // boss fights are what the planner optimises for by default
    costumes: {}, team: [], assists: {}, assistTeam: [],
    foods: {}, keychains: {}, kcSlots: 1, treasures: {}, treasureEq: {}, guide: {}, training: {}, study: {}, home: {},
    gear: { weapon: 0, tool: 0 }, progress: { weeding: 0, kitchen: 0 },
    gacha: { wt: { lv: 1, prog: 0 }, as: { lv: 1, prog: 0 }, gems: 0 },  // gacha levels (draws so far into the level) and gems on hand
    weapons: {}, tools: {}, weaponEq: 0, toolEq: 0,  // weapons & tools you own (id → level 1–100) and the equipped ones
  };
}

/* ---------------- formation context ---------------- */
function teamOf(st) { return (st.team || []).filter(id => COSTUME[id] && st.costumes[id]); }

function context(st) {
  const team = teamOf(st), ateam = assistTeamOf(st);
  const chars = new Set(team.map(id => COSTUME[id].char));
  const achars = new Set(ateam.map(id => ASSIST[id].char));
  const tags = new Set(team.map(id => COSTUME[id].cook).filter(Boolean));
  let maxAssistStar = 0; const assistStars = new Set();
  for (const id of ateam) { const a = assistStar(ASSIST[id]); assistStars.add(a); maxAssistStar = Math.max(maxAssistStar, a); }
  let menuLv = 0; for (const k in st.foods) menuLv += st.foods[k].lv || 0;
  let c100 = 0, c200 = 0;
  for (const k in st.costumes) { const lv = st.costumes[k].lv || 0; if (lv >= 100) c100++; if (lv >= 200) c200++; }
  const prog = { 1: +st.progress.weeding || 0, 2: +st.progress.kitchen || 0, 3: menuLv, 5: c100, 6: c200 };
  return { team, ateam, chars, achars, distinctTags: tags.size, maxAssistStar, assistStars, prog,
    // star of the equipped weapon / tool: from Weapons & Tools when one is marked equipped, else the Little House setting
    weapon: (gearEq(st, 'weapon') || {}).star || +((st.gear || {}).weapon) || 0,
    tool: (gearEq(st, 'tool') || {}).star || +((st.gear || {}).tool) || 0 };
}
function condMet(cd, ctx) {
  if (!cd) return true;
  const want = cd.vals[0];
  // rarity values are stars − 1. "Match" means exactly that rarity: checked in game, where Star Sticker (weapon Match 6)
  // works with a 7★ weapon but Fluffy Sofa (weapon Match 4) adds nothing.
  const cmp = (have, star) => { const w = star ? want + 1 : want; return cd.op === 'Match' ? have === w : have >= w; };
  switch (cd.fn) {
    case 'FormationWeaponRarity': return cmp(ctx.weapon, true);
    case 'FormationArmorRarity': return cmp(ctx.tool, true);
    case 'FormationAssistSkillRarity':
      return cd.op === 'Match' ? !!(ctx.assistStars && ctx.assistStars.has(want + 1)) : ctx.maxAssistStar >= want + 1;
    case 'FormationCostumeCookingTagCount': return cmp(ctx.distinctTags, false);
    default: return true;
  }
}
const condText = cd => {
  if (!cd) return '';
  const n = cd.vals[0];
  switch (cd.fn) {
    case 'FormationWeaponRarity': return `needs a ${n + 1}★+ weapon equipped`;
    case 'FormationArmorRarity': return `needs a ${n + 1}★+ tool equipped`;
    case 'FormationAssistSkillRarity': return `needs a ${n + 1}★+ assist equipped`;
    case 'FormationCostumeCookingTagCount':
      return cd.op === 'Match' ? (n === 1 ? 'needs all 6 outfits to share one specialty' : `needs exactly ${n} different specialties in the team`)
        : `needs ${n}+ different specialties in the team`;
    default: return cd.fn;
  }
};

/* ---------------- effect inventory ----------------
   Each effect: {st, v, scope:'acct'|'char'|'assist', who, flat?, gate?} */
function cfxEffects(id, L, promoMul, out, src) {
  const c = D.cfx[id];
  if (!c || !c.fx) return;
  // Progress-scaled items evaluate their curve at your progress, capped by a maximum that grows with item level
  // (reproduces the verified in-game caps, e.g. Bead Cushion Lv44: 0.015 × 310 = 465%).
  let v = c.ref === 'ContentsProgress'
    ? fxVal(c.fx, Math.min(src.ctx.prog[c.prog] || 0, group(c.maxG, L)))
    : fxVal(c.fx, L);
  v *= promoMul;
  const base = { st: c.fx.st, v, src: src.key, cond: c.cond };
  if (c.target === 'Party') out.push(Object.assign(base, { scope: 'acct' }));
  else if (c.target === 'SpecificCharacter') for (const ch of c.ids) out.push(Object.assign({}, base, { scope: 'char', who: ch }));
  else if (c.target === 'AssistCharacter') for (const ch of c.ids) out.push(Object.assign({}, base, { scope: 'assist', who: ch }));
}

// display (equip) bonus of one Little House item
function treasureEquipEffects(st, t, ctx, out) {
  const s = st.treasures[t.id];
  for (const e of t.equip) {
    const pm = group(e.promoG, s.promo || 0) || 1;
    if (e.cfx) cfxEffects(e.cfx, s.lv, pm, out, { key: 'treq:' + t.id, ctx });
    else out.push({ st: e.fx.st, v: fxVal(e.fx, s.lv) * pm, scope: 'acct', src: 'treq:' + t.id });
  }
  return out;
}
function buildEffects(st, ctx, opts) {
  const out = [];

  for (const id in st.foods) {
    const f = FOOD[id], lv = st.foods[id].lv || 0;
    if (!f || lv < 1) continue;
    for (const fx of f.fx) out.push({ st: fx.st, v: fxVal(fx, lv), scope: 'acct', src: 'food:' + id });
  }
  // costumes: milestone tiers + promotion
  for (const id in st.costumes) {
    const c = COSTUME[id], s = st.costumes[id];
    if (!c) continue;
    for (const t of c.tiers) if ((s.lv || 0) >= t.lv) out.push({ st: t.fx.st, v: fxVal(t.fx, s.lv), scope: 'acct', src: 'cos:' + id });
    // promotion bonus: its own multiplier for each outfit, not summed with the milestone bonuses. Checked Nov 8:
    // [Normal] Hachiware promotion 1 → 2 (ATK +25% → +50%) moved the banner +28.7v on ~143.4v = ×1.200 = 1.50 / 1.25.
    if ((s.promo || 0) >= 1) out.push({ st: c.promoFx.st, v: fxVal(c.promoFx, s.promo), scope: 'acct', src: 'promo' + id + ':' + id });
  }
  // assists owned
  for (const id in st.assists) {
    const a = ASSIST[id], lv = st.assists[id].lv || 0;
    if (!a || lv < 1) continue;
    out.push({ st: a.posFx.st, v: fxVal(a.posFx, lv), scope: 'acct', src: 'ast:' + id });
  }
  // keychains: nothing counts unless the keychain is equipped. Its equip bonus is that character's ATK; its star
  // bonuses (HP, damage stats, the assist's own boosts) only count "when <assist> is helping the team". Both are
  // checked when the effects are added up (aggregate), so the assist optimizer can try other teams and keychains
  // without rebuilding; opts.allKc also adds the owned keychains that aren't equipped.
  for (const id in st.keychains) {
    const k = KEYCHAIN[id], s = st.keychains[id];
    if (!k || !(s.star >= 1) || (!s.eq && !(opts && opts.allKc))) continue;
    const L = Math.max(1, s.lv || 1), i0 = out.length;
    cfxEffects(k.equip, L, 1, out, { key: 'kceq:' + id, ctx });
    const i1 = out.length;
    k.tiers.forEach((cid, i) => {
      if (s.star < k.tierStar[i]) return;
      const fx = k.tierFx && k.tierFx[i];
      if (fx) out.push({ st: fx.st, v: fxVal(fx, L), scope: 'acct', src: 'kc:' + id });
      else cfxEffects(cid, L, 1, out, { key: 'kc:' + id, ctx });

    for (let i = i0; i < out.length; i++) { out[i].kc = id; if (i >= i1) out[i].needA = k.assist; }
  }
  // little house
  for (const id in st.treasures) {
    const t = TREASURE[id], s = st.treasures[id];
    if (!t || !(s.lv >= 1)) continue;
    for (const p of t.pos) out.push({ st: p.fx.st, v: fxVal(p.fx, s.lv) * group(p.promoG, s.promo || 0), scope: 'acct', src: 'tr:' + id });
    if (st.treasureEq[t.series] == id) treasureEquipEffects(st, t, ctx, out);
  }
  // training (Training + Super Training) and study trees
  for (const [k, list] of [['training', D.training], ['study', D.study]]) {
    for (const n of list) {
      const lv = +(st[k] || {})[n.id] || 0;
      if (lv < 1) continue;
      // Training rate bonuses (Special Attack & Assist, Normal Attack, crit…) add percentage points to the stat's
      // total instead of multiplying: re-buying Super Training, its +10/+20/+40% Special Attack & Assist nodes and
      // +100/+200% Normal Attack nodes moved the banner by only 0.0005–0.004%, while its ATK nodes multiplied it
      // (the first +100% ATK doubled 336s to 673s). ATK and HP nodes keep their own multiplying pool per tree.
      const flat = k === 'training' && n.fx.st !== 'Attack' && n.fx.st !== 'Health';
      out.push({ st: n.fx.st, v: fxVal(n.fx, lv), scope: 'acct', src: k + ':' + n.id, flat });
    }
  }
  // weapons & tools: every one you own gives its bonus effect; the equipped weapon and tool add their equip bonus.
  // Each calculator (owned weapons, owned tools, equipped weapon, equipped tool) is its own source type.
  for (const kind of ['weapon', 'tool']) {
    const inv = gearInv(st, kind), eq = gearEq(st, kind), tag = kind === 'weapon' ? 'wpn' : 'arm';
    for (const id in inv) {
      const g = GEAR[kind][id], lv = gearLv(st, kind, id);
      if (!g || lv < 1) continue;
      out.push({ st: g.pos.st, v: fxVal(g.pos, lv), scope: 'acct', src: tag + ':' + id });
      if (eq && eq.id === g.id) out.push({ st: g.eq.st, v: fxVal(g.eq, lv), scope: 'acct', src: tag + 'eq:' + id });
    }
  }
  // home items: each owned item gives an ATK bonus by its level
  for (const id in (st.home || {})) {
    const h = HOME[id], lv = Math.min(h ? h.max : 0, +st.home[id] || 0);
    if (h && lv >= 1) out.push({ st: h.fx.st, v: fxVal(h.fx, lv), scope: 'acct', src: 'home:' + id });
  }
  // handbook (Dishes and Assists level with your foods / assists; the rest are entered by hand)
  for (const g of D.guidebook) {
    const id = g.id, lv = guideLevel(g, st);
    if (lv < 1) continue;
    if (g.mul) out.push({ st: g.mul.st, v: fxVal(g.mul, lv), scope: 'acct', src: 'gb:' + id });
    if (g.add) out.push({ st: g.add.st, v: fxVal(g.add, lv), scope: 'acct', flat: true, src: 'gb:' + id });
  }

}

/* aggregate effects that pass their gates for this formation */
/* The game builds each stat per SOURCE TYPE: every calculator (cooking menus, costumes, assists, keyholders, treasures,
   Training, Super Training, study, home items, art book) adds up all of its own bonuses to that stat and hands over one
   ×(1 + sum) element; the elements of the different source types then multiply (decompiled
   CookingMenuStatusCalculator / CostumeStatusCalculator.CalculatePercentStatus = sum + 1, type Multiply).
   So two foods add with each other, but a food and an outfit multiply. Confirmed in game: Cola Lv 23 → 24
   (+345% → +360% ATK) left ATK at 17m, because the food ATK total is already in the thousands of %. */
function srcCat(src) {
  const k = String(src || '').split(':');
  if (k[0] === 'training') { const n = TRAIN_NODE[k[1]]; return 'training' + (n ? n.group : 1); }
  if (k[0] === 'treq' || k[0] === 'kceq') return CAT_EQUIP[k[0]];
  return k[0];
}
var CAT_EQUIP = { treq: 'equip', kceq: 'equip' };
const TRAIN_NODE = {}; for (const n of D.training) TRAIN_NODE[n.id] = n;
/* Keychain star bonuses: they only count while the keychain's assist is equipped (kcGate), and a keychain on a
   character who isn't on the team does nothing at all (kcTeamOnly: Kurimanju's 4★ Manbou with Manbou equipped left
   the banner unchanged). Every equipped keychain gives its star bonuses, even two for the same assist: the Nov 13
   fit of 16 swaps only lands within 0.6% that way (kcOnePer off). kcOnePer/kcLeadOwned are kept as switches for the
   older "one keychain per assist" readings, which that data ruled out. */

  const lead = {}, rank = {};
  for (const id in st.keychains) {
    // kcLeadOwned: the lead is your best keychain of that assist whether or not it's equipped; if it isn't equipped,
    // nobody gets the star bonuses. Checked Nov 12: with Shisa's Nagareboshi 4★ Lv100 taken off, Chiikawa's
    // Nagareboshi 4★ Lv1 (the only one equipped) added nothing: putting Chiikawa back on Muchauman gained +250v,
    // as if she'd had no Nagareboshi bonuses at all (a take-over would have made it about +84v).
    const s = st.keychains[id], k = KEYCHAIN[id]; if (!k || !(s.star >= 1) || !(s.eq || TIMING.kcLeadOwned)) continue;
    const r = s.star * 1000 + (s.lv || 1);
    if (!(rank[k.assist] >= r)) { rank[k.assist] = r; lead[k.assist] = id; }
  }
  return lead;
}
function aggregate(effects, ctx, st) {
  const leads = kcLeads(st);
  const acct = {}; const flat = {}; const chars = {}; const assists = {};
  const bump = (o, cat, v) => { o[cat] = (o[cat] || 0) + v; };
  for (const e of effects) {
    if (e.cond && !condMet(e.cond, ctx)) continue;
    if (e.kc && !(st.keychains[e.kc] && st.keychains[e.kc].eq)) continue;
    if (e.needA && TIMING.kcGate && !ctx.achars.has(e.needA)) continue;  // star bonuses only while the assist is equipped
    if (e.needA && TIMING.kcOnePer && leads[e.needA] !== e.kc) continue;  // one keychain's star bonuses per assist (see kcLeads)
    // TIMING.kcChars (Trading Post): judge star bonuses by the old team's characters, so a character swap's keychain
    // effect can be shown apart; equip bonuses always follow who is on the team
    if (e.kc && TIMING.kcTeamOnly && !((e.needA && TIMING.kcChars) || ctx.chars).has(KEYCHAIN[e.kc].char)) continue;
    if (e.kc && !e.needA && TIMING.kcNoEquip && TIMING.kcNoEquip.has(KEYCHAIN[e.kc].char)) continue;  // Trading Post: outfit-only comparison  // keychains only count for characters on the team (checked Nov 8)
    const cat = e.cat || (e.cat = srcCat(e.src));
    if (e.scope === 'acct') {
      if (e.flat) { flat[e.st] = (flat[e.st] || 0) + e.v; continue; }
      const a = acct[e.st] || (acct[e.st] = { cats: {}, add: 0 });
      bump(a.cats, cat, e.v); a.add += e.v;
    } else if (e.scope === 'char') {
      if (!ctx.chars.has(e.who)) continue;
      const c = chars[e.who] || (chars[e.who] = {});
      bump(c[e.st] || (c[e.st] = {}), cat, e.v);
    } else if (e.scope === 'assist') {
      if (!ctx.achars.has(e.who)) continue;
      const a = assists[e.who] || (assists[e.who] = { cats: {}, mul: {}, add: {} });
      bump(a.cats[e.st] || (a.cats[e.st] = {}), cat, e.v);
      a.add[e.st] = (a.add[e.st] || 0) + e.v;
    }

  for (const k in acct) acct[k].mul = prod(acct[k].cats);
  for (const w in chars) for (const k in chars[w]) chars[w][k] = prod(chars[w][k]);
  for (const w in assists) for (const k in assists[w].cats) assists[w].mul[k] = prod(assists[w].cats[k]);
  return { acct, flat, chars, assists };
}

/* status-screen stats adjusted by the difference between two aggregates */
const STAT_KEYS = { cr: 'CriticalRate', cd: 'CriticalDamage', nr: 'NormalAttackDamageRate', ur: 'UniqueSkillDamageRate',
  sr: 'SkillDamageRate', boss: 'BossDamageRate', mob: 'MobDamageRate', asd: 'AssistSkillDamage' };
function stackMode(st, stat) { return (st.stack && st.stack[stat]) || DEFAULT_STACK[stat] || 'mul'; }
function effectiveStats(st, agg, base) {
  const S = { atk: 1 };
  const ratio = (stat) => {
    const a = agg.acct[stat] || { mul: 1, add: 0 }, b = base.acct[stat] || { mul: 1, add: 0 };
    return { mul: a.mul / b.mul, add: a.add - b.add, flat: (agg.flat[stat] || 0) - (base.flat[stat] || 0) };
  };
  const r = ratio('Attack'); S.atk = r.mul;
  for (const [k, stat] of Object.entries(STAT_KEYS)) {
    const screen = (+st.stats[k] || 0) / 100;
    const d = ratio(stat);
    const mode = stackMode(st, stat);
    let v = mode === 'add' ? screen + d.add : screen * d.mul;
    v += d.flat;  // flat additions: guidebook "add" entries, Training rate nodes
    S[k] = v;
  }
  S.spd = Math.max(0.01, +st.stats.spd || 1);
  S.cdr = Math.min(0.9, Math.max(0, (+st.stats.cdr || 0) / 100));
  S.acdr = S.cdr;  // the game has one 'Reduce Special & Assist Cooldown' stat
  return S;
}

/* After you make an upgrade in the game: the status-screen numbers it should now show, worked out with the same
   model as the rankings (the change in every effect from the old state to the new one). Returns only what moved;
   'banner' is the battle-screen total, 'atk' the ATK line. Stats left at 0 (never entered) are skipped. */
/* Small Candy Strength: the status screen shows 100% + the Training bonuses (max 100 + 60 + 200 + 10 = 370%).
   Each small candy gives that much outfit EXP, so the candies an outfit needs = its EXP / strength. A number typed
   in Stats wins; otherwise it comes from your Training levels. */
function candyTrainBonus(st) { let v = 0; for (const n of D.training) if (n.fx && n.fx.st === 'CostumeExperience') v += fxVal(n.fx, +st.training[n.id] || 0); return v; }
function candyStrength(st) { return +st.stats.candy > 0 ? st.stats.candy / 100 : 1 + candyTrainBonus(st); }
const smallCandies = (st, exp) => exp == null ? null : Math.ceil(exp / candyStrength(st));
function predictStats(stOld, stNew) {
  const b = makeBaseline(stOld);
  const ctx = context(stNew), agg = aggregate(buildEffects(stNew, ctx), ctx, stNew);
  const S = effectiveStats(stOld, agg, b.agg), out = {};
  const moved = (o, v) => o > 0 && isFinite(v) && Math.abs(v / o - 1) > 1e-9;
  for (const k of Object.keys(STAT_KEYS)) { const o = +stOld.stats[k] || 0, v = S[k] * 100; if (moved(o, v)) out[k] = v; }
  const oa = +stOld.stats.atk || 0; if (moved(oa, oa * S.atk)) out.atk = oa * S.atk;
  const oc = +stOld.stats.candy || 0, dc = candyTrainBonus(stNew) - candyTrainBonus(stOld);
  if (oc > 0 && Math.abs(dc) > 1e-12) out.candy = oc + dc * 100;
  const ob = +stOld.stats.banner || 0;
  if (ob > 0) { const r0 = evaluate(stOld, b).bannerShown, r1 = evaluate(stNew, b).bannerShown; if (r0 > 0 && moved(ob, ob * r1 / r0)) out.banner = ob * r1 / r0; }
  return out;
}

/* ---------------- battle model ---------------- */
var NORMAL_K = 15;  // normal-attack calibration: fits 18 Little House swaps read off the battle banner (normal attacks ≈ 0.2% of boss damage)
const BOSS_FRAC = { boss: 1, mixed: 0.5, waves: 0 };
/* Boss fights last 35 seconds, and assists' skills go off one at a time from a queue: at the start in the order
   they're equipped, then whoever is ready first (Config: 2 s queue wait between skills). This gives each assist's
   cast times in the fight, so a buff only counts for the part of the fight it's up and late slots cast less. */
const FIGHT_S = 35, ASSIST_GAP = 2;
function assistTimeline(ateam, acdr) {
  const ready = ateam.map(() => 0), times = ateam.map(() => []);
  let t = 0;
  while (t < FIGHT_S) {
    let pick = -1;
    for (let i = 0; i < ateam.length; i++) if (ready[i] <= t + 1e-9 && (pick < 0 || ready[i] < ready[pick] - 1e-9)) pick = i;
    if (pick < 0) { t = Math.max(t, Math.min(...ready)); if (!isFinite(t)) break; continue; }
    times[pick].push(t);
    const sk = D.skills[ASSIST[ateam[pick]].skill];
    ready[pick] = sk ? t + TIMING.cdCast * sk.castMs / 1000 + sk.recastMs / 1000 * (1 - acdr) : Infinity;

function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(st)); return true; } catch (e) { return false; } }
function scheduleSave() {
  clearTimeout(saveTimer); setSave('Saving…');
  saveTimer = setTimeout(saveNow, 900);
}
// leaving the page (closing the tab, switching apps on a phone) saves right away instead of waiting
function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; writeLocal(); saveNow(); } }
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
async function saveNow() {
  saveTimer = null;
  const local = writeLocal();
  if (db) {
    try { await db.doc(DOC).set({ state: st, savedAt: Date.now() }); setSave('Saved to your account'); return; }
    catch (e) { /* fall through */ }
  }
  setSave(local ? 'Saved on this device' : 'Not saved: storage is blocked here');
}
function changed(what) {
  scheduleSave();
  recompute();

// the battle screen's damage banner rises by the same % as the planner's total damage (checked: Somen +1.22% vs
// banner +130s on 10.7t, Steak Lv 100 → 101 +3.65% vs +395s on 10.8t)
// "≈ +X on the battle banner": the banner also counts damage to non-bosses, which boss-fight rankings leave out, so
// when the upgrade itself is at hand (c.apply) its banner change is worked out separately
const bannerMemo = new WeakMap();
function bannerText(g, c) {
  const b = st.rankBy === 'battle' ? 0 : (+st.stats.banner || 0);
  if (c && c.apply && b > 0) {
    if (!bannerMemo.has(c)) { const r0 = evaluate(st, base).bannerShown; bannerMemo.set(c, r0 > 0 ? evaluate(withChange(st, c.apply), base).bannerShown / r0 - 1 : g); }
    g = bannerMemo.get(c);
  }
  return b > 0 && g > 1e-9 ? `<span>≈ +${esc(fmtNum(b * g))} on the battle banner</span>` : '';
}
function resKey(c) { return c.cost ? c.cost.res : 'free'; }
function costText(c) {
  if (!c.cost) return '';
  if (c.cost.text != null) return c.cost.text;
  if (c.cost.n == null) return '';
  return `${fmtNum(c.cost.n)} ${RES[c.cost.res]}`;
}
function itemPill(c) {
  if (c.cat === 'food' && c.sub === 'set') return '<span class="pill r2">Handbook set</span>';
  if (c.cat === 'food') return `<span class="pill r${c.rarity}">${RAR[c.rarity]}</span>`;
  if (c.cat === 'kc') return `<span class="pill">${c.star}★</span>`;
  if (c.sub) return `<span class="pill">${esc(c.sub)}</span>`;
  return '';
}
function renderRanking() {
  if (ui.cat === 'shop') return;
  if (ui.cat === 'food') renderCandyPlan();
  const box = $('#rank'); if (!box) return;
  const all = candidates(ui.cat, st, base);
  if (!all.length) {
    box.innerHTML = `<div class="empty">Nothing to rank yet. Add what you own under <b>Your ${catNoun()}</b> below.</div>`;
    return;
  }
  const groups = {};
  for (const c of all) (groups[resKey(c)] = groups[resKey(c)] || []).push(c);
  const order = (GROUP_ORDER[ui.cat] || []).concat(Object.keys(groups)).filter((k, i, a) => a.indexOf(k) === i && groups[k]);
  let html = '';
  for (const g of order) {
    let list = groups[g];
    const dead = list.filter(c => !(c.gain > 1e-9));
    list = list.filter(c => c.gain > 1e-9);
    const priced = list.length && list.every(c => c.cost && c.cost.n > 0);
    const near = (x, y) => Math.abs(x - y) <= 1e-9 * Math.max(Math.abs(x), Math.abs(y), 1e-12);
    const tie = (a, b) => (b.evGain || 0) - (a.evGain || 0);
    list.sort(priced ? (a, b) => near(efficiency(a), efficiency(b)) ? tie(a, b) : efficiency(b) - efficiency(a)
                     : (a, b) => near(a.gain, b.gain) ? tie(a, b) : b.gain - a.gain);
    const [title, unit] = GROUPS[g] || [g, ''];
    // unit for "per" figures: a round power of 1000 near the typical cost
    let U = 1;
    if (priced) { const lo = Math.min(...list.map(c => c.cost.n)); U = Math.pow(1000, Math.max(0, Math.floor(Math.log10(Math.max(1, lo)) / 3))); }
    const perOf = c => Math.expm1(efficiency(c) * U);
    const top = priced ? Math.max(...list.map(perOf), 1e-12) : Math.max(...list.map(c => c.gain), 1e-12);
    const key = ui.cat + ':' + g;
    const shown = ui.showAll[key] ? list : list.slice(0, 6);
    html += `<section class="stack" style="gap:8px">
      <div class="group-h"><h3>${esc(title)}</h3><span class="muted">${priced ? 'best value first' : 'biggest gain first'}</span></div>`;
    if (!list.length) html += `<div class="empty">None of these add damage right now.</div>`;
    else html += `<ol class="rank">${shown.map((c, i) => {
      const per = priced ? perOf(c) : null;
      const w = Math.max(2, Math.min(100, 100 * (priced ? per : c.gain) / top));
      return `<li class="up${i === 0 ? ' top' : ''}">
        <span class="pos">${i + 1}</span>
        <div class="what"><div class="name">${esc(c.name)} ${itemPill(c)}</div><div class="act">${esc(c.action)}</div></div>
        <div class="gain${c.gain < 0 ? ' neg' : ''}" title="Change in total damage">${fmtPct(c.gain)}</div>
        <div class="bar" aria-hidden="true"><b style="width:${w}%"></b></div>
        <div class="meta">${costText(c) ? `<span class="cost">${esc(costText(c))}</span>` : ''}
          ${priced ? `<span>${fmtPct(per)} per ${U === 1 ? esc(SINGULAR[c.cost.res] || unit) : U.toLocaleString('en-US') + ' ' + esc(unit || RES[c.cost.res])}</span>` : ''}
          ${c.note ? `<span>${esc(c.note)}</span>` : ''}${bannerText(c.gain, c)}
          ${c.apply ? `<button class="btn done" data-done="${esc(c.key)}" aria-label="Mark as done: ${esc(c.name)}, ${esc(c.action)}">✓ Done</button>` : ''}</div>
      </li>`;
    }).join('')}</ol>`;
    if (list.length > 6) html += `<button class="btn ghost more" data-more="${key}">${ui.showAll[key] ? 'Show fewer' : `Show all ${list.length}`}</button>`;
    if (dead.length) html += `<p class="muted small" style="margin:0">${dead.length} more ${dead.length === 1 ? 'upgrade adds' : 'upgrades add'} no damage (HP, coins, or a bonus that needs a condition you don't meet).</p>`;
    html += `</section>`;
  }
  box.innerHTML = html;
  // "✓ Done": apply that upgrade to your saved levels, then re-rank (with Undo in the toast)
  const byKey = {}; for (const c of all) byKey[c.key] = c;
  box.querySelectorAll('[data-done]').forEach(btn => btn.onclick = () => {
    const c = byKey[btn.dataset.done]; if (!c || !c.apply) return;
    const prev = clone(st);
    const moved = applyAndPredict(c.apply);
    afterDone();
    toast(`${c.name}: ${c.action}${statNote(moved)}`, () => { st = prev; afterDone(); toast('Undone'); });
  });
  box.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { ui.showAll[b.dataset.more] = !ui.showAll[b.dataset.more]; renderRanking(); });
}
/* Apply a change you've made in the game, and move the status-screen numbers by what the planner predicts it did
   (marked as estimates in Stats until you type the game's number over them). Returns the stats that moved. */
function applyAndPredict(mut) {
  const before = clone(st);
  mut(st);
  const upd = predictStats(before, st), moved = Object.keys(upd);
  st.statsAuto = st.statsAuto || {};
  for (const k of moved) { st.stats[k] = upd[k]; st.statsAuto[k] = true; }
  return moved;
}
const statNote = moved => moved.length ? ` · ${moved.length} stat${moved.length === 1 ? '' : 's'} updated` : '';
function afterDone() {
  scheduleSave(); recompute();
  renderRanking(); refreshFeature(); renderEditor();
  if (ui.cat === 'candy' && typeof sectionTeam === 'function') sectionTeam();
}
function catNoun() { return { shop: 'trading post', gacha: 'gacha levels & gems', gear: 'weapons & tools', home: 'home items', food: 'food', candy: 'outfits', assist: 'assists', kc: 'keychains', house: 'little house', guide: 'handbook' }[ui.cat]; }

function onEdit(e) {

    const s = st.foods[m[2]] || { lv: 0, cap: 100 };
    if (m[1] === 'lv') s.lv = clampInt(el.value, 0, 300); else s.cap = clampInt(el.value, 100, 300);
    if (s.lv > s.cap) { s.cap = Math.min(300, 100 + 20 * Math.ceil((s.lv - 100) / 20)); const c = $('#food-cap-' + m[2]); if (c) c.value = s.cap; }

  } else if ((m = id.match(/^gc-(wt|as|gems)-?(lv|prog)?$/))) {

    else if (m[2] === 'lv') { st.gacha[m[1]].lv = clampInt(el.value, 1, gachaMax(m[1])); st.gacha[m[1]].prog = Math.min(st.gacha[m[1]].prog, Math.max(0, gachaLevelNeed(st.gacha[m[1]].lv) - 1)); }

  arr[i] = id; st.team = arr;
  changed('quiet'); sectionTeam(); renderRanking();
}
function moveSlot(i, d) {
  const arr = st.team.slice(); while (arr.length < 6) arr.push(null);
  const j = i + d; if (j < 0 || j > 5) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; st.team = arr;
  changed('quiet'); sectionTeam();
}

/* ======================= ASSISTS: best 6 and order ======================= */
function assistRole(a) {
  const sk = D.skills[a.skill]; if (!sk) return '';
  const hit = sk.effects.find(e => e.type === 'Attack');
  const other = sk.effects.find(e => e.type !== 'Attack');
  const buffName = e => ({ StatusCriticalRateUp: 'team crit rate up', StatusCriticalAttackUp: 'team crit damage up', StatusAttackUp: 'team attack up',
    StatusDefenceDown: 'enemies take more damage', StatusBossDamageUp: 'team boss damage up' }[e.type] || 'support');
  const parts = [];
  if (hit) parts.push(hit.range === 'Range' ? 'hits all enemies' : 'hits one enemy');
  if (other) parts.push(buffName(other));
  return parts.join(' + ') + ` · every ${sk.recastMs / 1000}s`;
}

    const trial = evaluate(withChange(st, x => { x.assistTeam = r.assists; for (const id in x.keychains) x.keychains[id].eq = r.keychains[KEYCHAIN[id].char] == id; }), base);
    const slotOf = id => trial.aslots.find(s => s.id === id) || {};
    // which equipped keychain this assist switches on

      .map(k => `${charName(KEYCHAIN[k].char)}'s ${st.keychains[k].star}★ keychain`);
    f.innerHTML = `<section class="card stack">
        <div class="row" style="justify-content:space-between"><h2>Best 6 to equip</h2><span class="muted small">in equip (firing) order</span></div>
        <ol class="rank">${r.assists.map((id, i) => { const a = ASSIST[id]; const sl = slotOf(id); const L = lights(id);
          return `<li class="up" style="grid-template-columns:26px 1fr auto">
            <span class="pos">${i + 1}</span>

              <div class="act">${esc(assistRole(a))}${L.length ? ` · turns on ${esc(L.join(', '))}` : ''}</div>
              ${sl.casts ? `<div class="act">fires at ${sl.casts.map(t => Math.floor(t) + 's').join(', ')}</div>` : ''}</div>
            <div class="gain" style="color:var(--ink)"></div></li>`; }).join('')}</ol>
        ${kcCh.length ? `<div class="small"><b>With these keychains:</b> ${kcCh.map(([ch, id]) => `${esc(charName(ch))}: ${esc(assistName(KEYCHAIN[id].assist))} ${st.keychains[id].star}★`).join(' · ')}</div>` : ''}

/* The battle banner also counts Damage to Non-Bosses, which a boss fight doesn't get, so a change can raise the
   banner and still not help against the boss (or the reverse). Say so when the two disagree by more than 1%. */
function bannerNote(trial) {
  const b0 = evaluate(st, base).bannerShown; if (!(b0 > 0)) return '';
  const db = trial.bannerShown / b0 - 1;
  const df = evaluate(st, base).total > 0 ? trial.total / evaluate(st, base).total - 1 : 0;
  if (Math.abs(db - df) < 0.01) return '';
  const v = +st.stats.banner > 0 ? ` (${db < 0 ? '−' : '+'}${esc(fmtNum(Math.abs(db) * st.stats.banner))})` : '';
  return `<div class="small muted">Battle banner: <b>${fmtPct(db)}</b>${v}. The banner also counts Damage to Non-Bosses, which a boss fight doesn't get.</div>`;
}

const FLAT_STATS = new Set(['BattleTimeLimit', 'WeedingActionMaxStamina']);
function fxText(stat, v) {
  const lab = SHORT[stat] || stat;
  if (FLAT_STATS.has(stat)) return `${lab} +${fmtNum(v)}${stat === 'BattleTimeLimit' ? 's' : ''}`;
  return `${lab} +${fmtNum(v * 100)}%`;

function sectionTree(kind) {
  const f = $('#feature'); if (!f) return;
  // a focused level box commits on blur; let it do so (it redraws the board itself) before redrawing here
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT' && f.contains(ae)) { ae.blur(); if (!ae.isConnected) return; }
  const cat = kind === 'study' ? 'study' : 'train';
  ui.treeGroup = ui.treeGroup || {};
  const group = kind === 'study' ? 1 : (ui.treeGroup[kind] || 1);
  const cur = st[kind] || {};
  const all = kind === 'study' ? D.study : D.training;
  const list = all.filter(n => (n.group || 1) === group);
  const by = {}; for (const n of all) by[n.id] = n;
  const lvOf = n => +cur[n.id] || 0;
  const maxed = n => n.max > 0 && lvOf(n) >= n.max;
  const open = n => n.req.every(r => !by[r] || maxed(by[r]));
  const superOn = st.superOn || D.training.some(n => n.group === 2 && (+cur[n.id] || 0) > 0);
  const locked2 = kind === 'training' && group === 2 && !superOn;

  // the node to level next: first step of the best-value candidate in this tree
  const cands = candidates(cat, st, base).filter(c => c.gain > 1e-9 && (c.group || 1) === group && c.cost && c.cost.n > 0);
  cands.sort((a, b) => efficiency(b) - efficiency(a));
  const nextId = cands.length ? cands[0].step : null;
  ui.treeSel = ui.treeSel || {};
  const selKey = kind + ':' + group;
  if (!ui.treeSel[selKey] || !by[ui.treeSel[selKey]] || (by[ui.treeSel[selKey]].group || 1) !== group) ui.treeSel[selKey] = nextId || list[0].id;
  const sel = by[ui.treeSel[selKey]];

  // layout: rows bottom-up, up to three tiles per row, half-step offsets like the game board
  const rows = {}; for (const n of list) (rows[n.row] = rows[n.row] || []).push(n);
  const R = Math.max(...list.map(n => n.row));
  const STEP = 88, ROWH = 104, TILE = 68, PAD = 22;
  const H = R * ROWH + PAD + 8;
  const pos = {};
  for (const r in rows) {
    const k = rows[r].length;
    rows[r].sort((a, b) => a.id - b.id).forEach((n, i) => { pos[n.id] = { x: (i - (k - 1) / 2) * STEP, y: (R - n.row) * ROWH + PAD }; });
  }
  const lines = [];
  for (const n of list) for (const r of n.req) if (pos[r]) {
    const a = pos[r], b = pos[n.id];
    lines.push(`<line class="${maxed(by[r]) ? 'done' : ''}" x1="${a.x}" y1="${a.y + TILE / 2}" x2="${b.x}" y2="${b.y + TILE / 2}"/>`);
  }
  const tiles = list.map(n => {
    const lv = lvOf(n), p = pos[n.id];
    const cls = ['tnode', maxed(n) ? 'max' : '', !open(n) ? 'locked' : '', sel && sel.id === n.id ? 'sel' : ''].join(' ');
    return `<button class="${cls}" data-node="${n.id}" style="left:calc(50% + ${p.x - TILE / 2}px);top:${p.y}px"
        aria-label="${esc(SHORT[n.fx.st] || n.fx.st)}, row ${n.row}, level ${lv} of ${n.max || 'unlimited'}">
      ${n.id === nextId && !locked2 ? '<span class="next">Next</span>' : ''}${glyph(n.fx.st)}
      <span class="lbl">${esc(TILE_LABEL[n.fx.st] || '')}</span><span class="lv">${lv}/${n.max || '∞'}</span></button>`;
  }).join('');

  // detail panel for the selected node
  const slv = lvOf(sel), cap = sel.max || Infinity;
  const nowV = slv ? fxVal(sel.fx, slv) : 0, nextV = fxVal(sel.fx, slv + 1);
  const cand = candidates(cat, st, base).find(c => c.nodeId === sel.id);
  // if this node is a stepping stone for the best locked target, say what it leads to
  const goal = cands.find(c => c.step === sel.id && c.nodeId !== sel.id) || null;
  const nextCost = slv < cap ? nodeCost(kind, sel, slv) : null;
  const mins = kind === 'study' && sel.levels && sel.levels[slv] ? sel.levels[slv].min : 0;
  const unit = kind === 'study' ? 'whistle candies' : (group === 2 ? 'Super Training Pts' : 'Training Pts');
  const needs = open(sel) ? '' : sel.req.filter(r => by[r] && !maxed(by[r])).map(r => `${SHORT[by[r].fx.st] || by[r].fx.st} (row ${by[r].row})`).join(', ');
  const panel = `<div class="node-panel">
      <div class="tnode${maxed(sel) ? ' max' : ''}" style="position:relative;cursor:default">${glyph(sel.fx.st)}<span class="lbl">${esc(TILE_LABEL[sel.fx.st] || '')}</span><span class="lv">${slv}/${sel.max || '∞'}</span></div>
      <div class="fx">${slv < cap
        ? `<div class="fx-line">${esc(fxText(sel.fx.st, nowV))}</div><div class="fx-arrow">▼</div><div class="fx-line next">${esc(fxText(sel.fx.st, nextV))}</div>`
        : `<div class="fx-line next">${esc(fxText(sel.fx.st, nowV))}</div>`}</div>
      <div class="ctrl">
        <button class="stepbtn" id="node-dec" aria-label="Lower level"${slv > 0 ? '' : ' disabled'}>−</button>
        <input type="number" inputmode="numeric" id="node-lv" min="0" ${sel.max ? `max="${sel.max}"` : ''} value="${slv}" aria-label="Level">
        <button class="stepbtn" id="node-inc" aria-label="Raise level"${slv < cap ? '' : ' disabled'}>+</button>
        ${sel.max ? `<button class="btn ghost" id="node-max"${slv < cap ? '' : ' disabled'}>Max</button>` : '<span class="small">no level cap</span>'}
      </div>
      <div class="info">
        ${nextCost != null ? `<span>Next level: <b>${fmtNum(nextCost)} ${unit}</b>${mins ? ` · ${mins >= 60 ? (mins / 60).toFixed(mins % 60 ? 1 : 0) + ' h' : mins + ' min'} at base speed` : ''}</span>` : '<span>Maxed.</span>'}
        ${needs ? `<span style="color:var(--pink)">Locked: max ${esc(needs)} first.</span>` : ''}
        ${cand && !needs && cand.gain > 1e-9 ? `<span>Damage from the next level: <b style="color:var(--mint)">${fmtPct(cand.gain)}</b></span>` : ''}
        ${goal ? `<span>Worth it as a step: maxing this opens <b>${esc(goal.name)}</b> (row ${by[goal.nodeId].row}), which with the rest of its path is worth <b style="color:var(--mint)">${fmtPct(goal.gain)}</b> for ${fmtNum(goal.cost.n)} ${unit}.</span>` : ''}
        ${cand && needs ? `<span>Reaching it and taking Lv 1: <b style="color:var(--mint)">${fmtPct(cand.gain)}</b> for ${fmtNum(cand.cost.n)} ${unit} in total</span>` : ''}
        ${(!cand || cand.gain <= 1e-9) && !goal && !maxed(sel) && !needs ? '<span class="muted">Doesn\'t add damage by itself (it helps coins, HP, candies, battle time or stamina).</span>' : ''}
      </div>
    </div>`;

  f.innerHTML = `<section class="board">
      ${kind === 'training' ? `<div class="board-tabs">
        <button class="board-tab" data-group="1" aria-pressed="${group === 1}">Training</button>
        <button class="board-tab" data-group="2" aria-pressed="${group === 2}">Super Training</button></div>` : ''}
      ${locked2 ? `<div class="empty">Super Training opens later in the game.<br><label for="super-on2" class="small" style="display:inline-flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="super-on2"> I've unlocked it</label></div>` : `
      ${panel}
      <div class="tree-scroll" id="tree-scroll"><div class="tree" style="height:${H}px">
        <svg width="1" height="${H}">${lines.join('')}</svg>${tiles}</div></div>
      <div class="tree-legend"><span><b style="color:var(--mint)">Next</b> = best value to level now</span><span>Tap a node to set its level</span><span>Solid line = parent maxed</span></div>`}
    </section>`;

  f.querySelectorAll('[data-group]').forEach(b => b.onclick = () => { ui.treeGroup[kind] = +b.dataset.group; sectionTree(kind); });
  const s2 = $('#super-on2'); if (s2) s2.onchange = () => { st.superOn = s2.checked; changed('quiet'); sectionTree(kind); renderRanking(); };
  if (locked2) return;
  f.querySelectorAll('[data-node]').forEach(b => b.onclick = () => { ui.treeSel[selKey] = +b.dataset.node; ui.treeScroll = $('#tree-scroll').scrollTop; sectionTree(kind); });
  const setLv = v => {
    const lv = Math.max(0, Math.min(sel.max || 1e9, Math.round(+v || 0)));
    st[kind] = Object.assign({}, st[kind]);
    if (lv) st[kind][sel.id] = lv; else delete st[kind][sel.id];
    ui.treeScroll = $('#tree-scroll').scrollTop;
    changed('quiet'); sectionTree(kind); renderRanking();
  };
  $('#node-dec').onclick = () => setLv(slv - 1);
  $('#node-inc').onclick = () => setLv(slv + 1);
  const mx = $('#node-max'); if (mx) mx.onclick = () => setLv(sel.max);
  $('#node-lv').onchange = e => setLv(e.target.value);
  // keep the board where the user left it; first time, scroll the selected node into view
  const sc = $('#tree-scroll');
  if (ui.treeScroll != null) { sc.style.scrollBehavior = 'auto'; sc.scrollTop = ui.treeScroll; sc.style.scrollBehavior = ''; ui.treeScroll = null; }
  else { sc.style.scrollBehavior = 'auto'; sc.scrollTop = Math.max(0, pos[sel.id].y - sc.clientHeight / 2 + TILE / 2); sc.style.scrollBehavior = ''; }
}

/* ======================= FOOD → BOOTHS (Om Nom Fest) ======================= */
function renderBooths() {
  const body = $('#food-body'); if (!body) return;
  const ae = document.activeElement;  // let a focused box commit first (it redraws this view itself)
  if (ae && ae.tagName === 'INPUT' && body.contains(ae)) { ae.blur(); if (!ae.isConnected) return; }
  st.fest = Object.assign({ rank: 1, boost: false }, st.fest || {});
  const plan = boothPlan(st);
  const mult = (1 + D.boothCfg.fest * (+st.fest.rank || 0)) * (st.fest.boost ? D.boothCfg.boost : 1);
  const owned = Object.keys(st.costumes).length;
  const row = (r, role) => r
    ? `<div class="bslot"><span class="pill">${role}</span><span class="bname">${esc(r.name)} <span class="muted">★${r.stars}</span></span>
        <span class="bspec${r.match ? ' ok' : ''}">${esc(D.cookTags[r.cook] || '')}${r.match ? ' ✓' : ''}</span><span class="num brate">${fmtTrunc(r.rate * mult)}/min</span></div>`
    : `<div class="bslot empty"><span class="pill">${role}</span><span class="bname muted">${role === 'Chef' ? 'no outfit for this character' : 'no outfit left'}</span></div>`;
  const cards = plan.booths.map(e => {
    const b = e.b, set = e.set;
    const settings = `<div class="ctl" style="justify-content:flex-start">
        <label for="bo-on-${b.id}"><input type="checkbox" id="bo-on-${b.id}"${set.on ? ' checked' : ''}>Open</label>
        ${numInput('bo-lv-' + b.id, set.lv, 1, 999, 'Booth Lv')}</div>`;
    if (!set.on) return `<article class="hb-card" style="opacity:.75"><div class="hb-top"><span class="hb-name">${esc(e.name)}</span><span class="hb-lv">closed</span></div>${settings}</article>`;
    const sous = []; for (let i = 0; i < set.slots; i++) sous.push(row(e.sous[i], 'Sous-chef'));
    return `<article class="hb-card">
      <div class="hb-top"><span class="hb-name">${esc(e.name)}</span><span class="hb-lv num">${fmtTrunc(e.rate * mult)}/min</span></div>
      <div class="bslots">${row(e.chef, 'Chef')}${sous.join('')}</div>
      ${e.chef && !e.chef.match ? (() => {
        const m = Object.keys(st.costumes).map(Number).map(id => COSTUME[id]).filter(c => c && c.char === b.char && c.cook === b.genre && (st.costumes[c.id].lv || 0) >= 1);
        return m.length
          ? `<div class="small muted">Your ${esc(BOOTH_DISH[b.genre])} ${esc(charName(b.char))} (${esc(costumeName(m[0]))}, ★${STARS[m[0].rarity]}) earns less here: a higher-star outfit beats a matching specialty.</div>`
          : `<div class="small" style="color:var(--pink)">You don't own a ${esc(charName(b.char))} outfit that cooks ${esc(BOOTH_DISH[b.genre])} yet.</div>`; })() : ''}
      ${settings}</article>`;
  }).join('');
  body.innerHTML = `<section class="card stack">
      <div class="row" style="justify-content:space-between"><h2>Best chefs for every booth</h2><span class="num" style="font-weight:600">${fmtTrunc(plan.perMin * mult)}/min</span></div>
      <div class="muted small">${fmtNum(plan.perMin * mult * 60)} Cooking Coins per hour from ${owned} owned outfit${owned === 1 ? '' : 's'}. Each booth's chef has to be that booth's character; sous-chefs can be anyone. Every outfit cooks at one booth at a time, and cooking doesn't affect your battle team.</div>
      <div class="ctl" style="justify-content:flex-start">${numInput('fest-rank', st.fest.rank, 0, 999, 'Fest Rank')}
        <label for="fest-boost"><input type="checkbox" id="fest-boost"${st.fest.boost ? ' checked' : ''}>×2 boost active</label></div>
      <div class="muted small">Fest Rank and the boost raise every booth equally. Fest Rank also opens sous-chef slots at every booth: one each at rank 25, 50, 75 and 100. You have ${sousSlots(st)}${sousSlots(st) < 4 ? `; the next opens at rank ${(sousSlots(st) + 1) * 25}` : ''}.</div>
    </section>
    <div class="stack" style="gap:8px">${cards}</div>
    <p class="muted small" style="margin:0">Outfits are taken from the Outfits tab (any outfit at Lv 1 or above counts as owned). Each slot earns 10 × (1 + booth Lv) × its rate, where the rate is ★4 0.3, ★5 1 or ★6 3, plus 1.5 when the outfit's specialty matches the booth. Sous-chefs earn 30% of that, and Fest Rank adds 1% per rank. Rates are cut to 3 digits the way the game shows them.</p>`;
  body.querySelectorAll('input,select').forEach(el => el.addEventListener('change', onBoothEdit));
}
/* ---------------- food big candies: best plan ---------------- */
function renderCandyPlan() {
  const box = $('#candyplan'); if (!box) return;
  if (box.contains(document.activeElement)) document.activeElement.blur();
  const c = st.candy, auto = boothPlan(st).perMin * (1 + D.boothCfg.fest * (+st.fest.rank || 0));
  const income = cookIncome(st), window = income * 1440 * (+c.days || 0);
  const r = candyPlan(st, base, c.have, window);
  // the same candies spent on one food only, for comparison
  let single = null;
  for (const g of r.groups) {
    let cand = 0, lg = 0, k = 0;
    for (const s of g.steps) { if (cand + s.candies > c.have) break; cand += s.candies; lg += s.lg; k++; }
    if (k && (!single || lg > single.lg)) single = { g, k, cand, lg, coins: g.steps.slice(0, k).reduce((a, s) => a + s.coins, 0) };
  }
  const rows = r.picks.map(p => {
    const raises = p.k === 1 ? '1 raise' : p.k + ' raises';
    return `<li class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start">
      <span style="flex:1;min-width:0"><b>${esc(p.g.f.name)}</b> <span class="pill r${p.g.f.rarity}">${RAR[p.g.f.rarity]}</span><br>
        <span class="small muted">Cap ${p.g.cap} → ${p.to} (${raises}) · ${fmtNum(p.coins)} coins, ≈ ${fmtDur(p.coins / income)}${p.g.lv < p.g.cap ? ` · includes Lv ${p.g.lv} → ${p.g.cap} first` : ''}</span></span>
      <span class="num small" style="text-align:right;white-space:nowrap"><b>${p.candies}</b> candies<br><span style="color:var(--mint)">${fmtPct(Math.expm1(p.lg))}</span></span></li>`;
  }).join('');
  box.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Food big candy plan</h2>
      ${r.picks.length ? `<span class="num" style="font-weight:600;color:var(--mint)">${fmtPct(r.gain)}</span>` : ''}</div>
    <p class="muted small" style="margin:0">The cap raises that add the most damage for the candies you have, among foods already at their max level, counting only ones whose cooking coins (to fill the 20 new levels) your booths earn within the time you allow.</p>
    <div class="ctl" style="justify-content:flex-start">
      ${numInput('cp-have', c.have, 0, 1000, 'Big candies')}
      ${numInput('cp-days', c.days, 0, 365, 'Days of coins')}
      <label for="cp-rate">Coins/min<input type="text" id="cp-rate" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:6.5em" placeholder="${esc(fmtNum(auto))}" value="${+c.rate > 0 ? esc(fmtNum(+c.rate)) : ''}"></label></div>
    <p class="muted small" style="margin:0">Coins/min: ${+c.rate > 0 ? 'your number' : `blank uses your best booth plan at Fest Rank ${+st.fest.rank || 0} (${esc(fmtNum(auto))}/min, no ×2 boost)`}. ${+c.days > 0 ? `${c.days} day${c.days == 1 ? '' : 's'} = ${fmtNum(window)} coins.` : 'Days 0 = ignore coins.'}</p>
    ${r.picks.length ? `<ol class="rank" style="gap:6px">${rows}</ol>
      <div class="small">Uses <b>${r.candies}</b> of ${c.have} candies and <b>${fmtNum(r.coins)}</b> coins (≈ ${fmtDur(r.coins / income)} of booth income) for <b style="color:var(--mint)">${fmtPct(r.gain)}</b> total damage${+st.stats.banner > 0 ? ` (≈ +${esc(fmtNum(st.stats.banner * r.gain))} on the battle banner)` : ''}.</div>
      ${single && (single.g !== r.picks[0].g || r.picks.length > 1) ? `<div class="small muted">Best you could do on a single food: ${esc(single.g.f.name)}, ${single.cand} candies, cap ${single.g.cap} → ${single.g.steps[single.k - 1].to}, ${fmtPct(Math.expm1(single.lg))}, ${fmtNum(single.coins)} coins (≈ ${fmtDur(single.coins / income)}).</div>` : ''}`
    : `<div class="empty">${c.have > 0 ? 'No cap raise fits these candies and coins yet. Only foods at their max level count, so level foods up to their cap first, or allow more days.' : 'Enter how many food big candies you have.'}</div>`}`;
  box.querySelectorAll('input').forEach(el => el.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'cp-have') st.candy.have = clampInt(e.target.value, 0, 1000);
    else if (id === 'cp-days') st.candy.days = Math.max(0, Math.min(365, +e.target.value || 0));
    else { const v = parseNum(e.target.value); st.candy.rate = v > 0 ? v : 0; }
    scheduleSave(); renderRanking();
  }));
}

function onBoothEdit(e) {
  const el = e.target, id = el.id; let m;
  st.booths = st.booths || {};
  if ((m = id.match(/^bo-(on|lv)-(\d+)$/))) {
    const b = st.booths[m[2]] = Object.assign({}, st.booths[m[2]]);
    if (m[1] === 'on') b.on = el.checked;
    else if (m[1] === 'lv') b.lv = clampInt(el.value, 1, 999);
  } else if (id === 'fest-rank') st.fest.rank = clampInt(el.value, 0, 999);
  else if (id === 'fest-boost') st.fest.boost = el.checked;
  scheduleSave(); renderBooths();
}

      <div class="row"><button class="btn primary" id="import-btn">Restore backup</button></div>
    </section>
    <section class="card stack">
      <h2>What's counted</h2>
      <p class="small" style="margin:0">Food, outfit milestones and promotions, assists, weapons and tools (owned and equipped), keychains (stars, levels and equip), little-house items (owned, displayed, conditions), Training, Super Training, Study, handbook entries, team buffs and debuffs, crit, and boss or non-boss damage. Blessings and the coin upgrades on the battle screen aren't ranked, but they're already part of your Stats numbers, so the rankings account for them.</p>
      <p class="small muted" style="margin:0">Game data from the Chiikawa Pocket datamine (Global client, data through Sept 2026). Names matched from Japanese fan wikis, so in-game English names may differ slightly. Peter Pan outfits are newer than this data.</p>
    </section>`;
  renderMix();
  v.querySelectorAll('input[id^=s-]').forEach(inp => inp.onchange = () => {
    const k = inp.id.slice(2); const n = parseNum(inp.value);
    if (!isFinite(n) || n < 0) { inp.value = fmtNum(+st.stats[k] || 0); toast('Use a number like 850 or 4.2a'); return; }
    st.stats[k] = n; inp.value = fmtTrunc(n); if (st.statsAuto) delete st.statsAuto[k]; changed('quiet'); toast('Saved');
  });
  v.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { st.mode = r.value; changed('quiet'); });
  v.querySelectorAll('input[name=rankby]').forEach(r => r.onchange = () => { st.rankBy = r.value; changed('quiet'); toast(r.value === 'battle' ? 'Ranking by the fight estimate' : 'Ranking by the battle banner'); });
  $('#aoe').onchange = e => { st.aoe = clampInt(e.target.value, 1, 10); changed('quiet'); };
  v.querySelectorAll('select[id^=k-]').forEach(s => s.onchange = () => { st.stack[s.id.slice(2)] = s.value; changed('quiet'); });
  $('#copy-data').onclick = async () => {
    const txt = JSON.stringify(st);
    try { await navigator.clipboard.writeText(txt); toast('Backup copied'); }
    catch (e) { const b = $('#import-box'); b.value = txt; b.select(); toast('Select-all and copy the text in the box'); }
  };
  $('#load-example').onclick = () => { st = normalize(exampleState()); recompute(); scheduleSave(); renderAll(); toast('Example account loaded'); };
  $('#clear-all').onclick = () => {
    if (!ui.confirmClear) { ui.confirmClear = true; renderSettings(); setTimeout(() => { ui.confirmClear = false; if (ui.tab === 'set') renderSettings(); }, 4000); return; }
    ui.confirmClear = false; st = normalize(blankState()); recompute(); scheduleSave(); renderAll(); toast('Everything erased');
  };
  $('#import-btn').onclick = () => {
    try { const o = JSON.parse($('#import-box').value); if (!o || typeof o !== 'object' || !o.stats) throw 0;
      st = normalize(o); recompute(); scheduleSave(); renderAll(); toast('Backup restored'); }
    catch (e) { toast('That doesn\'t look like a planner backup'); }
  };
}

/* ======================= boot ======================= */
function renderAll() { renderBanner(); showTab(current()); }
async function boot() {
  const hash = (location.hash || '').slice(1);
  for (const [k, tok] of Object.entries(TAB_TOKENS)) if (tok === hash) { if (k === 'set') ui.tab = 'set'; else { ui.tab = 'up'; ui.cat = k; } }
  const local = readLocal();
  st = normalize(local || exampleState());
  recompute(); renderAll();
  setSave(local ? 'Saved on this device' : 'Example account · not saved');
  let found = null;
  // the account database is optional: if it doesn't answer within 8 s (or the browser blocks it), keep working on this device
  const timeout = ms => new Promise(res => setTimeout(() => res(null), ms));
  try { found = window.claude && window.claude.use ? await Promise.race([window.claude.use('db'), timeout(8000)]) : null; } catch (e) { found = null; }
  if (!found) return;
  db = found;
  try {
    const snap = await Promise.race([db.doc(DOC).get(), timeout(10000).then(() => { throw new Error('timeout'); })]);
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.state) {
      st = normalize(clone(remote.state)); writeLocal(); recompute(); renderAll(); setSave('Saved to your account');
    } else setSave(local ? 'Saved on this device · syncs to your account on your next change' : 'Example account · not saved');
  } catch (e) { db = null; setSave(local ? 'Saved on this device' : 'Example account · not saved'); }
  const note = $('#store-note'); if (note && db) note.textContent = 'Saved privately to your account, so it follows you to any device.';
}
boot();

</script>

<script>
// works offline once opened (and from the home screen); always fetches the newest version when online
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
